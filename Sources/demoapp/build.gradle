apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def isLocalBuild = rootProject.findProject(':pushwoosh') != null

// Pushwoosh SDK modules — single list for both local and Maven builds.
// To add a new module: just append to this list.
def pushwooshModules = [
    'pushwoosh',
    'pushwoosh-firebase',
    'pushwoosh-badge',
    'pushwoosh-calls',
    'pushwoosh-location',
    'pushwoosh-amazon',
    'pushwoosh-huawei',
    'pushwoosh-inbox',
    'pushwoosh-inbox-ui',
    'pushwoosh-liveupdates',
    'pushwoosh-inapp-ui',
]

if (isLocalBuild) {
    apply from: '../scripts/buildSdk/build.gradle'
    apply from: '../scripts/prepareAar/build.gradle'

    // Release wiring for the SDK modules: build their AARs, then consume them as
    // local files (build-as-consumed check). Direct task-path dependencies, not a
    // nested GradleBuild — an included build (Sources/build-logic) can't itself be
    // included by a build launched via the GradleBuild task type.
    android.applicationVariants.configureEach { variant ->
        if (variant.name == "release") {
            ArrayList<String> assembleReleaseList = new ArrayList<>()
            ArrayList<String> copyToGlobalList = new ArrayList<>()
            ArrayList<String> bundleReleaseAarList = new ArrayList<>()
            for (String projectName in pushwooshModules) {
                assembleReleaseList.add(String.format(":%s:assembleRelease", projectName))
                copyToGlobalList.add(String.format(":%s:copyToGlobal", projectName))
                bundleReleaseAarList.add(String.format(":%s:bundleReleaseAar", projectName))
                dependencies {
                    releaseImplementation fileTree(include: ["*.aar"], dir: "../${projectName}/build/outputs/aar")
                }
            }

            variant.preBuildProvider.configure {
                it.dependsOn(assembleReleaseList)
                it.dependsOn(bundleReleaseAarList)
            }
            variant.assembleProvider.configure { it.finalizedBy(copyToGlobalList) }
        }
    }
}

android {
    namespace 'com.pushwoosh.sampleapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.pushwoosh.sampleapp"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "PUSHWOOSH_SDK_VERSION", "\"${libs.versions.pushwooshFirebase.get()}\""
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            if (isLocalBuild) {
                debuggable true
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

// In standalone Maven builds, exclude legacy Android Support Library pulled transitively
// by some SDK modules (e.g. pushwoosh-badge) to avoid duplicate class errors vs androidx.core.
// Not needed in local builds where project dependencies don't cause this conflict.
if (!isLocalBuild) {
    configurations.all {
        exclude group: 'com.android.support'
    }
}

dependencies {
    implementation libs.google.services
    implementation libs.play.services.location
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.firebase.messaging
    implementation libs.swiperefreshlayout
    implementation libs.work.runtime
    implementation libs.glide

    // Pushwoosh SDK — auto-switch between project refs and Maven artifacts
    def pwVersion = libs.versions.pushwooshFirebase.get()
    pushwooshModules.each { module ->
        if (isLocalBuild) {
            debugApi project(":$module")
        } else {
            implementation "com.pushwoosh:$module:$pwVersion"
        }
    }

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

apply plugin: "com.google.gms.google-services"

// both plugins validate their config's package_name against applicationId, so keep the bundle in sync
apply plugin: "com.huawei.agconnect"

if (!isLocalBuild) {
    googleServices {
        disableVersionCheck = true
    }
}
