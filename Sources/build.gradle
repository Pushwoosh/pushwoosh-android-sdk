// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.8.22'
    ext.huawei_version = '1.9.1.300'
    ext.gradle_version = '8.9.1'
    ext.dokka_version = '2.0.0'
    repositories {
        google()
        mavenCentral()
        // huawei maven
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url = uri("https://plugins.gradle.org/m2/") }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.huawei.agconnect:agcp:$huawei_version"
        classpath libs.google.services
        // Dokka stays here, not in scripts/docs/dokka-html.gradle: loaded by a script's own
        // classloader it loses sight of AGP ("could not get Android Extension").
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:$dokka_version"
        classpath 'com.adarshr:gradle-test-logger-plugin:4.0.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'pushwoosh.spotless'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // huawei maven
        maven { url 'https://developer.huawei.com/repo/' }
    }
}

subprojects {
    ext.global_versionName = "6.11.0"
    ext.global_targetGroupId = "com.pushwoosh"

    ext.googlePlayService = "18.4.0"
    ext.googleLocationServices = "21.0.1"
    ext.firebase = "24.0.0"
    ext.support = "1.0.0"
    ext.legacy_support_v4 = "1.0.0"
    ext.androidx_core = "1.13.1"
    ext.webkit = "1.4.0"
    ext.glide = "4.16.0"
    ext.constraint = "1.1.3"
    ext.material = "1.6.0"
    ext.recyclerview = "1.3.2"
    ext.workManager = "2.9.0"
    ext.huawei = "6.1.0.300"
    ext.mockito = "5.8.0"
}

// Multi-module HTML documentation (dokkaPostProcess) - root project only
apply from: 'scripts/docs/dokka-html.gradle'

// ============================================
// Test Logger Configuration
// ============================================
// Applied to all modules with Test tasks. Default output is silent on success
// and verbose on failure. Adjust per-run via -Pverbose=true to also print passed
// tests (useful when you suspect a hung test and want to see progress).

subprojects {
    apply plugin: 'com.adarshr.test-logger'

    testlogger {
        theme 'plain'
        showPassed project.hasProperty('verbose')
        showSkipped false
        showFailed true
        showSummary true
        showStandardStreams false
        showExceptions true
        showCauses true
        showStackTraces true
        slowThreshold 2000
    }
}
