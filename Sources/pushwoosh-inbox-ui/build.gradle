plugins {
    id 'com.android.library'
    id 'pushwoosh.android-library'
    id 'pushwoosh.android-minified'
    id 'pushwoosh.lint'
    id 'pushwoosh.dokka'
}

ext {
    targetArtefactIdDev = "pushwoosh-inbox-ui-dev"
    targetArtefactId = "pushwoosh-inbox-ui"
    targetName = "Pushwoosh Inbox UI"
    targetDescription = "Pushwoosh Inbox UI"
}


apply from: '../scripts/buildSdk/publish.gradle'
apply from: '../scripts/prepareAar/build.gradle'

apply plugin: 'kotlin-android'

android {
    namespace "com.pushwoosh.inbox.ui"
    testNamespace "com.pushwoosh.inbox.ui.test"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation "androidx.recyclerview:recyclerview:${recyclerview}"
    implementation libs.swiperefreshlayout
    implementation "com.google.android.material:material:${material}"

    implementation "androidx.constraintlayout:constraintlayout:${constraint}"
    implementation "com.github.bumptech.glide:glide:${glide}"

    api project(':pushwoosh')
    api project(':pushwoosh-inbox')

    // Fix Kotlin stdlib conflict in androidTest: androidx.lifecycle brings old kotlinx-coroutines:1.6.4
    // which pulls kotlin-stdlib-jdk8:1.7.20, conflicting with kotlin-stdlib:1.8.22
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Custom Javadoc generation for Maven publication
apply from: '../scripts/buildSdk/javadoc.gradle'
