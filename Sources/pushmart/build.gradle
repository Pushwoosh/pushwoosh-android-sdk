apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.pushwoosh.pushmart'
    compileSdk 36

    defaultConfig {
        applicationId "com.pushwoosh.pushmart"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation libs.core.ktx
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.firebase.messaging

    // Local SDK sources only: this showcase is never built against Maven artifacts.
    implementation project(':pushwoosh')
    implementation project(':pushwoosh-firebase')
    implementation project(':pushwoosh-badge')
    implementation project(':pushwoosh-inbox')
    implementation project(':pushwoosh-inbox-ui')
    implementation project(':pushwoosh-inapp-ui')

    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

apply plugin: "com.google.gms.google-services"
